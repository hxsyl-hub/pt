# 实验 v4：在 v3 基础上降低增强强度
# 依据：数据集仅 1743 张，mosaic 1.0 + mixup 0.1 + 剪切 0.2 + 旋转 5 度 + 上下翻转 0.5
# 会让模型学到更多不变性，但会牺牲严格定位精度（mAP50-95）
# 配套命令行：MULTI_SCALE=0 IMAGE_WEIGHTS=0（脚本参数控制，不写在本文件）
# 相对 v3 的改动：mixup 0.1→0.0，shear 0.2→0.0，degrees 5→0，scale 0.5→0.3

lr0: 0.001
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 0.0
warmup_momentum: 0.0
warmup_bias_lr: 0.0

box: 0.05
cls: 0.5
cls_pw: 1.0
obj: 1.0
obj_pw: 1.0
iou_t: 0.20
anchor_t: 4.0
fl_gamma: 0.0
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 0
translate: 0.1
scale: 0.3
shear: 0.0
perspective: 0.0
flipud: 0.5
fliplr: 0.5
mosaic: 1.0
mixup: 0.0
copy_paste: 0.0
