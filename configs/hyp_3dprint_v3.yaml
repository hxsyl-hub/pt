# 实验 v3：以 v2 权重接力训练，只把学习率从 1e-4 提到 1e-3
# 依据：v2 的 mAP50-95 在 50 轮内仅到 0.814 且末段仍有波动，Adam 的常规初始学习率为 1e-3，
# 1e-4 导致收敛过慢（train/box_loss 降至 0.024，高于旧配置的 0.015）
# 与 hyp_3dprint.yaml 相比仅 lr0 不同，便于归因

lr0: 0.001
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 0.0
warmup_momentum: 0.0
warmup_bias_lr: 0.0

box: 0.05
cls: 0.5
cls_pw: 1.0
obj: 1.0
obj_pw: 1.0
iou_t: 0.20
anchor_t: 4.0
fl_gamma: 0.0
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 5
translate: 0.1
scale: 0.5
shear: 0.2
perspective: 0.0
flipud: 0.5
fliplr: 0.5
mosaic: 1.0
mixup: 0.1
copy_paste: 0.0
