# 基线选择：关闭全部在线数据增强，用于对比 yolov5 与 yolov11 的基本能力
# 配套命令行：MULTI_SCALE=0 IMAGE_WEIGHTS=0 LABEL_SMOOTHING=0
# 数据：label_dataset/dataset_2（train 1743 / val 534）
# 两个模型使用同一份超参数与训练轮数，保证可比

lr0: 0.001
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 0.0
warmup_momentum: 0.0
warmup_bias_lr: 0.0

box: 0.05
cls: 0.5
cls_pw: 1.0
obj: 1.0
obj_pw: 1.0
iou_t: 0.20
anchor_t: 4.0
fl_gamma: 0.0

# 在线数据增强全部关闭
hsv_h: 0.0
hsv_s: 0.0
hsv_v: 0.0
degrees: 0.0
translate: 0.0
scale: 0.0
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.0
mosaic: 0.0
mixup: 0.0
copy_paste: 0.0
